services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ragebox
      POSTGRES_USER: ragebox
      POSTGRES_PASSWORD: ragebox
    ports: ["5432:5432"]
    volumes: ["ragebox-postgres:/var/lib/postgresql/data"]
  nginx:
    image: nginx:1.27-alpine
    ports: ["8080:80"]
    volumes: ["./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on: [postgres]
volumes:
  ragebox-postgres:
